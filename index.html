<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Order Notification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f7f7f7;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }
    h2 {
      color: #333;
    }
    p {
      font-size: 16px;
      margin: 8px 0;
    }
    .highlight {
      font-weight: bold;
      color: #e67e22;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome to Food Spot Cafe !!!</h2>
    <h3>New Order 🍽️</h3>

    <p><span class="highlight">Customer:</span> <span id="customer"></span></p>
    <p><span class="highlight">Mobile:</span> <span id="mobile"></span></p>
    <p><span class="highlight">Ordered Items:</span> <span id="items"></span></p>
    <p><span class="highlight">Estimated Time to Deliver:</span> Within 20-30 mins</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);

    // Get dynamic values from URL
    const customer = urlParams.get("customer") || "Walk-in Customer";
    const mobile = urlParams.get("mobile") || "Not Provided";
    const items = urlParams.get("items") || "No items found";

    // Set values to HTML
    document.getElementById("customer").innerText = customer;
    document.getElementById("mobile").innerText = mobile;
    document.getElementById("items").innerText = items;
  </script>

</body>
</html>
