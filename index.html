<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h2>Table Ordering</h2>
  <p id="table"></p>

  <button onclick="placeOrder()">Order Pizza</button>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tableId = urlParams.get("table") || "1";
    document.getElementById("table").innerText = "Table: " + tableId;

    async function placeOrder() {
      const order = {
        table_id: tableId,
        items: [{ name: "Pizza", qty: 1 }],
        total: 25
      };

      const res = await fetch("https://avijitemail01.app.n8n.cloud/webhook-test/restaurant-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
      });

      const data = await res.json();
      alert(data.message);
    }
  </script>
</body>
</html>
