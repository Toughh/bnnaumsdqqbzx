<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Order Notification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }
    h2 { margin-bottom: 5px; }
    p { font-size: 16px; margin: 8px 0; }
    .highlight { font-weight: bold; }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background-color: #28a745;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #218838;
    }
    select {
      margin-top: 10px;
      padding: 5px;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome to Food Spot Cafe !!!</h2>
    <h3>New Order 🍽️</h3>

    <p><span class="highlight">Customer:</span> <span id="customer"></span></p>
    <p><span class="highlight">Mobile:</span> <span id="mobile"></span></p>
    <p><span class="highlight">Ordered Items:</span> <span id="items"></span></p>
    <p><span class="highlight">Created At:</span> <span id="created_at">Calculating...</span></p>

    <p><span class="highlight">Status:</span></p>
    <select id="status">
      <option>Ordered Successfully</option>
      <option>Order In Progress</option>
      <option>Order Delivered</option>
    </select>

    <button onclick="confirmOrder()">Confirm & Send to Kitchen</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);

    // Get dynamic values from URL
    const customer = urlParams.get("customer") || "Walk-in Customer";
    const mobile = urlParams.get("mobile") || "Not Provided";
    const items = urlParams.get("items") || "No items found";

    // Function to get current datetime in dd:mm:yy:hh:mm:ss format
    function getCurrentDateTime() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yy = String(now.getFullYear()).slice(-2);
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${dd}:${mm}:${yy}:${hh}:${min}:${ss}`;
    }

    const createdAt = getCurrentDateTime();

    // Display values
    document.getElementById("customer").innerText = customer;
    document.getElementById("mobile").innerText = mobile;
    document.getElementById("items").innerText = items;
    document.getElementById("created_at").innerText = createdAt;

    async function confirmOrder() {
      const selectedStatus = document.getElementById("status").value;

      const orderData = {
        customer: customer,
        mobile: mobile,
        items: items,
        status: [selectedStatus],     // send as array for Airtable
        created_at: [createdAt]       // send as array for Airtable
      };

      try {
        const res = await fetch("https://avijitemail01.app.n8n.cloud/webhook/restaurant-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(orderData)
        });

        const data = await res.json();
        console.log(data);
        alert("Order sent to kitchen successfully!");
      } catch (error) {
        alert("Error sending order to n8n");
        console.error(error);
      }
    }
  </script>

</body>
</html>
