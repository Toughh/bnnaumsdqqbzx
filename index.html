<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Order Notification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }
    h2 { margin-bottom: 5px; }
    p { font-size: 16px; margin: 8px 0; }
    .highlight { font-weight: bold; }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background-color: #28a745;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome to Food Spot Cafe !!!</h2>
    <h3>New Order 🍽️</h3>

    <p><span class="highlight">Customer:</span> <span id="customer"></span></p>
    <p><span class="highlight">Mobile:</span> <span id="mobile"></span></p>
    <p><span class="highlight">Ordered Items:</span> <span id="items"></span></p>
    <p><span class="highlight">Estimated Time to Deliver:</span> Within 20-30 mins</p>

    <button onclick="confirmOrder()">Confirm & Send to Kitchen</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);

    // Get dynamic values from URL
    const customer = urlParams.get("customer") || "Walk-in Customer";
    const mobile = urlParams.get("mobile") || "Not Provided";
    const items = urlParams.get("items") || "No items found";

    // Display on page
    document.getElementById("customer").innerText = customer;
    document.getElementById("mobile").innerText = mobile;
    document.getElementById("items").innerText = items;

    async function confirmOrder() {
      const orderData = {
        customer: customer,
        mobile: mobile,
        items: items,
        status: "Confirmed by Restaurant",
        estimated_time: "20-30 mins"
      };

      try {
        const res = await fetch("https://avijitemail01.app.n8n.cloud/webhook/restaurant-order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(orderData)
        });

        const data = await res.json();
		console.log(data);
        alert("Order sent to kitchen successfully!");
      } catch (error) {
        alert("Error sending order to n8n");
        console.error(error);
      }
    }
  </script>

</body>
</html>
